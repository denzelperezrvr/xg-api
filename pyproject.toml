[project]
name = "xg"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "denzelperezrvr", email = "denzel.perezrvr@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.146.0",
    "joblib>=1.6.0",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "pydantic>=2.14.1",
    "scikit-learn>=1.9.1",
    "statsbombpy>=1.22.0",
    "uvicorn[standard]>=0.54.0",
    "xgboost>=3.4.1",
]

[project.scripts]
xg = "xg:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
