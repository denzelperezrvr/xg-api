<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculadora de xG</title>
<style>
:root{--bg:#f3f5f1;--panel:#fbfcfa;--text:#18211b;--muted:#5f6b62;--line:#d5dcd3;--accent:#0f6b3f;--grass:#3d8f5c;--grass2:#388856;--chalk:rgba(255,255,255,.9);--shot:#ffd84a}
@media (prefers-color-scheme:dark){:root{--bg:#0f1411;--panel:#161d18;--text:#e6ece7;--muted:#8d9a90;--line:#28332b;--accent:#5fd49a;--grass:#1f5c3a;--grass2:#1b5535}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI",system-ui,-apple-system,sans-serif;line-height:1.4}
main{max-width:1000px;margin:0 auto;padding:24px 16px 40px}
header{margin-bottom:16px}
h1{margin:0;font-size:1.5rem;font-weight:650;letter-spacing:-.01em}
header p{margin:4px 0 0;color:var(--muted);font-size:.95rem}
.layout{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:24px;align-items:start}
@media(max-width:780px){.layout{grid-template-columns:1fr}}
#pitch{width:100%;height:auto;display:block;border-radius:10px;cursor:crosshair;touch-action:none;user-select:none}
.grass{fill:var(--grass)}.band{fill:var(--grass2)}
.ln{fill:none;stroke:var(--chalk);stroke-width:.35}
.dot{fill:var(--chalk)}
#cone{fill:rgba(255,216,74,.22);stroke:var(--shot);stroke-width:.2}
#ball{fill:var(--shot);stroke:#1b1b1b;stroke-width:.4}
.readout{margin-top:8px;font-size:.85rem;color:var(--muted);display:flex;gap:16px;flex-wrap:wrap}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px}
.result{display:flex;align-items:baseline;gap:12px}
.xg{font-size:3.2rem;font-weight:700;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.result span{color:var(--muted);font-size:.9rem}
.bar{height:6px;background:var(--line);border-radius:3px;margin:14px 0 6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
#msg{min-height:1.2em;font-size:.85rem;color:var(--muted);margin:0}
#msg.err{color:#c0392b}
hr{border:0;border-top:1px solid var(--line);margin:18px 0}
label{display:block;font-size:.85rem;color:var(--muted);margin:12px 0 4px}
select{width:100%;padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit}
select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.check{display:flex;align-items:center;gap:10px;margin:12px 0 0;color:var(--text);font-size:.95rem}
.check input{width:18px;height:18px;accent-color:var(--accent)}
</style>
</head>
<body>
<main>
<header>
  <h1>Calculadora de xG</h1>
  <p>Haz clic en la cancha donde está el jugador y elige las condiciones del tiro.</p>
</header>
<div class="layout">
  <section>
    <svg id="pitch" viewBox="-4 -5 88 69" role="img" aria-label="Media cancha de fútbol. Haz clic para colocar el tiro.">
      <rect class="grass" x="-4" y="-5" width="88" height="69"/>
      <rect class="band" x="-4" y="12" width="88" height="12"/>
      <rect class="band" x="-4" y="36" width="88" height="12"/>
      <rect class="ln" x="0" y="0" width="80" height="60"/>
      <rect class="ln" x="18" y="0" width="44" height="18"/>
      <rect class="ln" x="30" y="0" width="20" height="6"/>
      <rect class="ln" x="36" y="-2" width="8" height="2"/>
      <path class="ln" d="M32 18 A10 10 0 0 0 48 18"/>
      <path class="ln" d="M30 60 A10 10 0 0 1 50 60"/>
      <circle class="dot" cx="40" cy="12" r=".5"/>
      <polygon id="cone" points="40,30 36,0 44,0"/>
      <circle id="ball" cx="40" cy="20" r="1.3"/>
    </svg>
    <div class="readout">
      <span id="r-pos">x 100 · y 40</span>
      <span id="r-dist">Distancia 20.0 m</span>
    </div>
  </section>
  <section class="panel">
    <div class="result"><div class="xg" id="xg">–</div><span>probabilidad de gol</span></div>
    <div class="bar"><i id="fill"></i></div>
    <p id="msg">Calculando…</p>
    <hr>
    <label for="shot_body_part">Parte del cuerpo</label><select id="shot_body_part"></select>
    <label for="shot_type">Tipo de tiro</label><select id="shot_type"></select>
    <label for="shot_technique">Técnica</label><select id="shot_technique"></select>
    <label for="play_pattern">Origen de la jugada</label><select id="play_pattern"></select>
    <label class="check"><input type="checkbox" id="shot_first_time"> Tiro de primera</label>
    <label class="check"><input type="checkbox" id="under_pressure"> Bajo presión</label>
  </section>
</div>
</main>
<script>
const OPTIONS = {
  shot_body_part: [["Right Foot","Pie derecho"],["Left Foot","Pie izquierdo"],["Head","Cabeza"],["Other","Otra parte"]],
  shot_type: [["Open Play","Jugada abierta"],["Free Kick","Tiro libre"],["Corner","Córner"],["Kick Off","Saque inicial"]],
  shot_technique: [["Normal","Normal"],["Half Volley","Media volea"],["Volley","Volea"],["Lob","Globo"],["Diving Header","Cabezazo en palomita"],["Overhead Kick","Chilena"],["Backheel","Taconazo"]],
  play_pattern: [["Regular Play","Juego regular"],["From Counter","Contraataque"],["From Corner","Tras córner"],["From Free Kick","Tras tiro libre"],["From Throw In","Tras saque de banda"],["From Goal Kick","Tras saque de meta"],["From Keeper","Tras balón del portero"],["From Kick Off","Tras saque inicial"],["Other","Otro"]]
};
const $ = id => document.getElementById(id);
const svg = $("pitch");
const state = { x: 100, y: 40 };
let timer, dragging = false;

for (const [id, opts] of Object.entries(OPTIONS)) {
  $(id).innerHTML = opts.map(([v, l]) => `<option value="${v}">${l}</option>`).join("");
  $(id).addEventListener("change", schedule);
}
$("shot_first_time").addEventListener("change", schedule);
$("under_pressure").addEventListener("change", schedule);

// Coordenadas StatsBomb: x 60-120 (portería en 120), y 0-80. En el SVG: svgX = y, svgY = 120 - x
function place(evt) {
  const pt = svg.createSVGPoint();
  pt.x = evt.clientX; pt.y = evt.clientY;
  const p = pt.matrixTransform(svg.getScreenCTM().inverse());
  state.x = Math.round(Math.min(120, Math.max(60, 120 - p.y)) * 10) / 10;
  state.y = Math.round(Math.min(80, Math.max(0, p.x)) * 10) / 10;
  draw(); schedule();
}
function draw() {
  $("ball").setAttribute("cx", state.y);
  $("ball").setAttribute("cy", 120 - state.x);
  $("cone").setAttribute("points", `${state.y},${120 - state.x} 36,0 44,0`);
  const d = Math.hypot(120 - state.x, 40 - state.y);
  $("r-pos").textContent = `x ${state.x} · y ${state.y}`;
  $("r-dist").textContent = `Distancia ${d.toFixed(1)} m`;
}
svg.addEventListener("pointerdown", e => { dragging = true; svg.setPointerCapture(e.pointerId); place(e); });
svg.addEventListener("pointermove", e => { if (dragging) place(e); });
svg.addEventListener("pointerup", () => dragging = false);

function schedule() { clearTimeout(timer); timer = setTimeout(predict, 120); }

async function predict() {
  const body = {
    x: state.x, y: state.y,
    shot_body_part: $("shot_body_part").value,
    shot_type: $("shot_type").value,
    shot_technique: $("shot_technique").value,
    play_pattern: $("play_pattern").value,
    shot_first_time: $("shot_first_time").checked,
    under_pressure: $("under_pressure").checked
  };
  try {
    const r = await fetch("/predict", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body)
    });
    if (!r.ok) throw new Error(`La API respondió ${r.status}`);
    const { xg, model_version } = await r.json();
    $("xg").textContent = xg.toFixed(2);
    $("fill").style.width = Math.min(100, xg * 100) + "%";
    $("msg").className = ""; $("msg").textContent = `Modelo ${model_version}`;
  } catch (e) {
    $("msg").className = "err";
    $("msg").textContent = "No se pudo calcular. Revisa que la API esté corriendo.";
  }
}
draw(); predict();
</script>
</body>
</html>
